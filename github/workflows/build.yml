name: Compilar Live2Pro (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Descargar ffmpeg, yt-dlp, deno y VLC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force bin, vlc, tmp | Out-Null

          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bin\yt-dlp.exe

          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile tmp\ffmpeg.zip
          Expand-Archive tmp\ffmpeg.zip tmp\ffmpeg
          Copy-Item (Get-ChildItem tmp\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin\ffmpeg.exe

          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile tmp\deno.zip
          Expand-Archive tmp\deno.zip bin -Force

          Invoke-WebRequest https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.zip -OutFile tmp\vlc.zip
          Expand-Archive tmp\vlc.zip tmp\vlc
          $v = (Get-ChildItem tmp\vlc -Directory | Select-Object -First 1).FullName
          Copy-Item "$v\libvlc.dll","$v\libvlccore.dll" vlc\
          Copy-Item "$v\plugins" vlc\plugins -Recurse

          Get-ChildItem bin, vlc | Format-Table Name, Length

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar con PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name Live2Pro --paths live2pro
          --collect-all NDIlib --collect-all PySide6 --hidden-import vlc
          live2pro\app.py

      - name: Copiar bin y vlc a la carpeta final
        shell: pwsh
        run: |
          Copy-Item bin dist\Live2Pro\bin -Recurse
          Copy-Item vlc dist\Live2Pro\vlc -Recurse

      - name: Crear instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Zip portátil
        shell: pwsh
        run: Compress-Archive dist\Live2Pro Live2Pro-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Live2Pro-windows
          path: |
            Live2Pro-portable.zip
            Output\Live2Pro-Setup.exe
